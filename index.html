<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Comment Miner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:#0f0f14; color:#e8e8ef; max-width:820px; margin:0 auto; padding:24px; }
  h1 { font-size:1.6rem; margin-bottom:4px; }
  .sub { color:#8a8a9a; margin-bottom:24px; font-size:0.95rem; }
  label { display:block; font-weight:600; margin:18px 0 6px; }
  textarea { width:100%; height:160px; background:#1a1a24; border:1px solid #333;
             border-radius:8px; color:#e8e8ef; padding:12px; font-size:0.9rem;
             font-family: ui-monospace, monospace; resize:vertical; }
  button { background:#6c5ce7; color:#fff; border:none; border-radius:8px;
           padding:12px 28px; font-size:1rem; cursor:pointer; margin-top:14px; }
  button:hover { background:#5a4bd1; }
  button:disabled { background:#333; cursor:not-allowed; }
  #status { margin-top:16px; color:#8a8a9a; font-size:0.9rem; white-space:pre-wrap; }
  #results { margin-top:24px; }
  .section { background:#1a1a24; border-radius:8px; padding:16px; margin-bottom:16px; }
  .section h2 { font-size:1.1rem; margin-bottom:10px; }
  .row { display:flex; justify-content:space-between; padding:3px 0;
         border-bottom:1px solid #2a2a36; font-size:0.88rem; }
  .row:last-child { border:none; }
  .n { color:#6c5ce7; font-weight:600; min-width:48px; text-align:right; }
  .note { color:#8a8a9a; font-size:0.8rem; margin-top:8px; }
  a { color:#6c5ce7; }
</style>
</head>
<body>
<h1>⛏️ YouTube Comment Miner</h1>
<p class="sub">Browser version — no install. Paste competitor video URLs, tap run.</p>

<label for="urls">Video URLs (one per line)</label>
<textarea id="urls" placeholder="https://www.youtube.com/watch?v=XXXX
https://www.youtube.com/watch?v=YYYY"></textarea>

<button id="runBtn" onclick="runMiner()">Run miner</button>
<div id="status"></div>
<div id="results"></div>

<script>
const STOP = new Set("the a an and or but if in on at to for of is it this that with was were be are you your i my me we they them he she his her from by as not so do does did can will just like about what when who how why all any some out up down get got one two also really very too much more most than then now here there back still even only well yeah yes no ok okay".split(" "));
const SIGNALS = ["wish","should","could","how to","does anyone","anyone know","please","need to","want to","trying to"];
const MINLEN = 4, TOPN = 30, MAXC = 500;

function extractId(url){ const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }
function tokenize(t){ return t.toLowerCase().match(/[a-z0-9']+/g)||[]
  .filter(w=>!STOP.has(w) && w.length>=MINLEN); }

async function fetchComments(vid){
  // Uses a public CORS proxy to hit the no-key comment endpoint
  const api = `https://yt.lemnoslife.com/noKey/videos?part=comments&id=${vid}&maxResults=${MAXC}`;
  try{
    const r = await fetch(api);
    const j = await r.json();
    const items = j.items||[];
    return items.map(i=>i.snippet?.topLevelComment?.snippet?.textDisplay||"").filter(Boolean);
  }catch(e){ return []; }
}

function analyze(comments){
  const wc=new Map(), p2=new Map(), p3=new Map();
  for(const text of comments){
    const toks=tokenize(text);
    for(const w of toks) wc.set(w,(wc.get(w)||0)+1);
    for(let i=0;i<toks.length-1;i++){ const p=toks[i]+" "+toks[i+1]; p2.set(p,(p2.get(p)||0)+1); }
    for(let i=0;i<toks.length-2;i++){ const p=toks[i]+" "+toks[i+1]+" "+toks[i+2]; p3.set(p,(p3.get(p)||0)+1); }
  }
  const top=(m,n)=>[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,n);
  const signals=[...p3.entries()].sort((a,b)=>b[1]-a[1]).filter(([p])=>SIGNALS.some(k=>p.includes(k))).slice(0,20).map(([p])=>p);
  return {wc:top(wc,TOPN), p2:top(p2,TOPN), p3:top(p3,TOPN), signals};}

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(res, total){
  let html = `<div class="section"><h2>🔥 High-signal phrases (${res.signals.length})</h2>`;
  html += res.signals.length ? res.signals.map(p=>`<div class="row"><span>${esc(p)}</span></div>`).join("") : "<div class='row'>None found</div>";
  html += `</div><div class="section"><h2>📊 Top ${TOPN} 3-word phrases</h2>`;
  html += res.p3.map(([p,n])=>`<div class="row"><span class="n">${n}</span><span>${esc(p)}</span></div>`).join("");
  html += `</div><div class="section"><h2>🔗 Top ${TOPN} 2-word phrases</h2>`;
  html += res.p2.map(([p,n])=>`<div class="row"><span class="n">${n}</span><span>${esc(p)}</span></div>`).join("");
  html += `</div><div class="section"><h2>📝 Top ${TOPN} words</h2>`;
  html += res.wc.map(([w,n])=>`<div class="row"><span class="n">${n}</span><span>${esc(w)}</span></div>`).join("");
  html += `</div><p class="note">Mined ${total} comments. Paste the high-signal section into Claude Pro to cluster into episode ideas.</p>`;
  document.getElementById("results").innerHTML = html;
}

async function runMiner(){
  const btn = document.getElementById("runBtn");
  const status = document.getElementById("status");
  const raw = document.getElementById("urls").value;
  const lines = raw.split("\n").map(l=>l.trim()).filter(l=>l && !l.startsWith("#"));
  if(!lines.length){ status.textContent="Paste at least one URL first."; return; }
  btn.disabled=true; status.textContent="Starting...";
  let all=[], done=0;
  for(const url of lines){
    const vid=extractId(url);
    if(!vid){ status.textContent+=`\n⚠️ Bad URL: ${url}`; continue; }
    status.textContent+=`\nFetching ${vid}...`;
    const texts=await fetchComments(vid);
    status.textContent+=` ${texts.length} comments`;
    all=all.concat(texts); done++;
  }
  if(!all.length){ status.textContent+="\nNo comments retrieved (comments may be disabled on those videos)."; btn.disabled=false; return; }
  status.textContent+=`\nAnalyzing ${all.length} comments...`;
  render(analyze(all), all.length);
  btn.disabled=false;
}
</script>
</body>
</html>
